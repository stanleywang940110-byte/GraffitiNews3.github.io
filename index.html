<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>街頭塗鴉 | Street Art Vibes</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎重置與背景設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.15), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 128, 0.15), transparent 30%);
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            /* 把滑鼠游標換成十字瞄準星 */
            cursor: crosshair;
        }

        /* 頂部標題區 */
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
            border-bottom: 6px solid #00ffcc;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            font-size: 4.5rem;
            margin: 0;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px #00ffcc, -3px -3px 0px #fff;
            transform: rotate(-3deg);
            pointer-events: none; /* 讓點擊可以穿透文字產生噴漆 */
        }

        /* 主要內容區 */
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        p.intro {
            font-size: 1.3rem;
            color: #ccc;
            margin-bottom: 40px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* 影片外框與裝飾 */
        .video-wrapper {
            position: relative;
            padding: 15px;
            background: #000;
            border: 5px dashed #ffeb3b;
            border-radius: 12px;
            box-shadow: 15px 15px 0px rgba(255, 235, 59, 0.8);
            transform: rotate(2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; /* 影片上方保持可以點擊的游標 */
        }

        .video-wrapper:hover {
            transform: rotate(-1deg) scale(1.02);
            box-shadow: -15px 15px 0px rgba(255, 0, 127, 0.8);
            border-color: #00ffcc;
        }

        video {
            width: 100%;
            border-radius: 8px;
            display: block;
            pointer-events: auto;
        }

        /* 滑鼠點擊的噴漆特效 CSS */
        .click-splatter {
            position: absolute;
            border-radius: 50%;
            pointer-events: none; /* 避免擋住後續點擊 */
            z-index: 5;
            filter: blur(4px);
            animation: sprayAnim 0.4s ease-out forwards;
        }

        @keyframes sprayAnim {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* 底部 */
        footer {
            text-align: center;
            padding: 40px;
            font-family: 'Permanent Marker', cursive;
            color: #555;
            font-size: 1.2rem;
            margin-top: 50px;
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Graffiti Zone</h1>
    </header>

    <div class="container">
        <p class="intro">點擊網頁任何地方，留下你的專屬塗鴉記號！</p>

        <div class="video-wrapper">
            <video controls autoplay loop muted playsinline>
                <source src="塗鴉.mp4" type="video/mp4">
                你的瀏覽器不支援 HTML5 影片播放。
            </video>
        </div>
    </div>

    <footer>
        Keep it Real © 2026
    </footer>

    <script>
        document.addEventListener('click', function(e) {
            // 創建一個新的 div 來當作噴漆痕跡
            const splatter = document.createElement('div');
            splatter.classList.add('click-splatter');
            
            // 隨機決定噴漆的大小 (50px 到 120px 之間)
            const size = Math.floor(Math.random() * 70) + 50;
            splatter.style.width = size + 'px';
            splatter.style.height = size + 'px';
            
            // 讓噴漆中心對準滑鼠點擊的位置
            splatter.style.left = (e.pageX - size / 2) + 'px';
            splatter.style.top = (e.pageY - size / 2) + 'px';
            
            // 隨機挑選螢光色：藍綠、粉紅、黃色
            const colors = ['#00ffcc', '#ff007f', '#ffeb3b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            // 設定漸層背景，模擬噴漆中心濃、邊緣淡的效果
            splatter.style.background = `radial-gradient(circle, ${randomColor} 0%, transparent 70%)`;
            
            // 把噴漆加到網頁裡
            document.body.appendChild(splatter);
        });
    </script>

</body>
</html>
